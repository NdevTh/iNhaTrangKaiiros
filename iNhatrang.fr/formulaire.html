<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Ajouter un produit - Backoffice Inhatrang</title>
  <link rel="stylesheet" href="formulaire.css">
</head>
<body>

  <header>
    <h1>Backoffice Inhatrang</h1>
    <nav>
      <a href="#">Dashboard</a> |
      <a href="#">Déconnexion</a>
    </nav>
  </header>

  <main>
    <h2>Ajouter / Modifier un produit</h2>
    <form method="POST" action="traitement.php" enctype="multipart/form-data">
      <div class="form-group">
        <label for="validation">Validation (0 ou 1) :</label>
        <input type="number" name="validation" id="validation" min="0" max="1" required>
      </div>

      <div class="form-group">
        <label for="image">Image du produit :</label>
        <input type="file" name="image" id="image" accept="image/*" required>
      </div>

      <div class="form-group">
        <label for="nom">Nom du produit :</label>
        <input type="text" name="nom" id="nom" placeholder="ex: P1. Nems au porc" required>
      </div>

      <div class="form-group">
        <label for="description">Description :</label>
        <textarea name="description" id="description" rows="4" placeholder="Ingrédients, etc." required></textarea>
      </div>

      <div class="form-group">
        <label for="prix">Prix (€) :</label>
        <input type="number" name="prix" id="prix" step="0.01" required>
      </div>

      <button type="submit">Enregistrer</button>
    </form>
  </main>

</body>
</html>
